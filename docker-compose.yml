services:
  db:
    image: postgres:16-alpine
    container_name: weight_training_db
    environment:
      POSTGRES_USER: trainer
      POSTGRES_PASSWORD: strongpassword123
      POSTGRES_DB: weight_training
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainer -d weight_training"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weight_training_backend
    environment:
      DATABASE_URL: postgresql://trainer:strongpassword123@db:5432/weight_training
      NODE_ENV: production
    ports:
      # Nur lokal: das SPA erreicht die API über nginx im Compose-Netz
      - "127.0.0.1:3011:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: weight_training_frontend
    ports:
      - "3002:80"
    depends_on:
      - backend
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: weight_training_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      # Desktop-Modus ohne Login → nur lokal erreichbar
      - "127.0.0.1:5052:80"
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:

networks:
  default:
    ipam:
      config:
        - subnet: 192.168.102.0/24
